  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: linear-gradient(to bottom, #063FA9, #012C97);
    min-height: 100vh;
    color: #e8eeff;
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }

  /* ── header ── */
  #header {
    padding: 14px 20px;
    background: rgba(0,0,0,.18);
    border-bottom: 1px solid rgba(255,255,255,.08);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #header-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 10px rgba(255,255,255,.6);
    flex-shrink: 0;
  }
  #header-title {
    font-family: 'PhatBoy', sans-serif;
    font-size: 15px;
    letter-spacing: .14em;
    color: #fff;
    text-transform: uppercase;
  }

  /* ── main ── */
  #wrap {
    padding: 28px 20px 20px;
    max-width: 480px;
  }

  #state {
    font-family: 'PhatBoy', sans-serif;
    font-size: 26px;
    margin: 0 0 10px;
    letter-spacing: .04em;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,.3);
  }

  #det {
    font-size: 12px;
    color: rgba(255,255,255,.45);
    margin: 0 0 6px;
    line-height: 1.7;
  }
  #det b { color: rgba(255,255,255,.8); font-weight: 600; }

  #cache {
    font-size: 11px;
    color: rgba(255,255,255,.25);
    margin: 0;
    min-height: 14px;
    letter-spacing: .02em;
  }
  #cache.cacheok { color: #7fd0a0; }

  /* ── fw chip ── */
  #fw-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 18px;
    padding: 6px 12px;
    background: rgba(0,0,0,.18);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 6px;
    font-size: 12px;
    color: rgba(255,255,255,.45);
  }
  #fw-chip b { color: rgba(255,255,255,.8); }

  .ok   { color: #7fd0a0; }
  .bad  { color: #e87a76; }
  .warn { color: #e8c878; }
</style>
</head>
<body>

<div id="header">
  <div id="header-dot"></div>
  <div id="header-title">PS4 Jailbreak</div>
</div>

<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
  <div id="fw-chip" style="display:none">
    fw <b id="fw-val">—</b>
  </div>
</div>

<script>
(function () {
  var stateEl = document.getElementById("state");
  var detEl   = document.getElementById("det");
  var cacheEl = document.getElementById("cache");
  var chipEl  = document.getElementById("fw-chip");
  var fwVal   = document.getElementById("fw-val");

  function setState(t, c) {
    stateEl.textContent = t;
    stateEl.className = c || "";
  }
  function setCache(t, ok) {
    cacheEl.textContent = t;
    cacheEl.className = ok ? "cacheok" : "";
  }

  var params = new URLSearchParams(location.search);
  var key = null, fwnum = null;
  var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
  if (m) {
    var minor = parseInt(m[2], 16);
    var ms = minor.toString(16);
    if (ms.length < 2) ms = "0" + ms;
    key = m[1] + "." + ms;
    fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    chipEl.style.display = "inline-flex";
    fwVal.textContent = key;
  }

  var bug = null, why = "";
  var forced = params.get("bug");
  if (forced === "lapse" || forced === "poops") {
    bug = forced; why = "forced via ?bug=" + forced;
  } else if (!key) {
    why = "user-agent is not a PlayStation 4";
  } else if (fwnum <= 1202) {
    bug = "lapse"; why = key + " ≤ 12.02";
  } else if (fwnum >= 1250) {
    bug = "poops"; why = key + " ≥ 12.50";
  } else {
    why = key + " — no working exploit (lapse ends at 12.02, poops needs 12.50)";
  }

  detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
    + " &middot; exploit <b>" + (bug || "none") + "</b>"
    + " &middot; " + why;

  if (!bug) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }

  var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
    + location.search;

  function go() {
    setState("loading " + bug + "...", "warn");
    location.replace(target);
  }

  function waitForTap(msg, action) {
    setState(msg, "warn");
    function fire() {
      window.removeEventListener("click", fire);
      window.removeEventListener("keydown", fire);
      action();
    }
    window.addEventListener("click", fire);
    window.addEventListener("keydown", fire);
  }

  var ac = window.applicationCache;
  if (!ac || !document.documentElement.hasAttribute("manifest")) {
    go();
  } else if (!navigator.onLine) {
    setCache("offline — using cache", true); go();
  } else if (ac.status === ac.IDLE) {
    setCache("cached ✓", true); go();
  } else if (ac.status === ac.UPDATEREADY) {
    try { ac.swapCache(); } catch (e) {}
    setCache("update ready", true);
    waitForTap("UPDATE READY — tap or press X to reload", function () { location.reload(); });
  } else {
    setCache("checking cache...");
    ac.addEventListener("downloading",  function () { setCache("caching for offline..."); }, false);
    ac.addEventListener("progress", function (e) {
      if (e && e.total) setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
    }, false);
    ac.addEventListener("cached", function () {
      setCache("cached ✓", true);
      waitForTap("CACHED — tap or press X to run", go);
    }, false);
    ac.addEventListener("updateready", function () {
      try { ac.swapCache(); } catch (e) {}
      setCache("update ready", true);
      waitForTap("UPDATE READY — tap or press X to reload", function () { location.reload(); });
    }, false);
    ac.addEventListener("noupdate",  function () { setCache("cached ✓", true); go(); }, false);
    ac.addEventListener("error",     function () {
      setCache("cache unavailable");
      waitForTap("CACHE FAILED — tap or press X to run anyway", go);
    }, false);
    ac.addEventListener("obsolete",  function () {
      setCache("cache obsolete");
      waitForTap("CACHE OBSOLETE — tap or press X to run", go);
    }, false);
  }
})();
</script>
</body>
</html>
